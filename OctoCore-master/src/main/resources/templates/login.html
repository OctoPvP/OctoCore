<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/flowbite@1.5.4/dist/flowbite.min.css" />
    <script src="https://unpkg.com/flowbite@1.5.4/dist/flowbite.js"></script>

    <title>Login</title>

    <script>
        //setInterval(function () {
        //location.reload();
        //}, 1000);
    </script>

    <style>
        :root {
            background-color: #233348;
            color: white;
        }

        input {
            color: white;
        }
    </style>
</head>
<body>
<div class="flex items-center min-h-screen p-4 lg:justify-center">
    <div
            class="flex flex-col overflow-hidden rounded-md shadow-lg max md:flex-row lg:max-w-screen-md"
            style="background-color: #212f43;"
    >
        <div class="p-5 bg-slate-900 md:flex-1">
            <h3 class="my-4 text-2xl font-semibold text-white" style="text-align: center">OctoCore Master Login</h3>
            <div class="mb-4 text-sm text-gray-500 items-center" style="text-align: center">
                <p>
                    Ask an admin for more info.
                </p>
            </div>
            <div th:if="${error} != null">
                <div id="error-alert" class="flex p-4 mb-4 bg-red-100 rounded-lg dark:bg-red-200" role="alert">
                    <svg aria-hidden="true" class="flex-shrink-0 w-5 h-5 text-red-700 dark:text-red-800" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
                    <span class="sr-only">Info</span>
                    <div class="ml-3 text-sm font-medium text-red-700 dark:text-red-800">
                        <p th:text="${error}">Invalid username/password!</p>
                    </div>
                    <button type="button" class="ml-auto -mx-1.5 -my-1.5 bg-red-100 text-red-500 rounded-lg focus:ring-2 focus:ring-red-400 p-1.5 hover:bg-red-200 inline-flex h-8 w-8 dark:bg-red-200 dark:text-red-600 dark:hover:bg-red-300" data-dismiss-target="#error-alert" aria-label="Close">
                        <span class="sr-only">Close</span>
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                    </button>
                </div>
            </div>
            <form th:action="@{/login}" class="flex flex-col space-y-5" method="post">
                <div class="flex flex-col space-y-1">
                    <label for="username" class="text-sm font-semibold text-gray-400">Username</label>
                    <input
                            type="text"
                            id="username"
                            name="username"
                            autofocus
                            placeholder="Steve"
                            class="px-4 py-2 transition duration-300 border border-gray-300 rounded focus:border-transparent focus:outline-none focus:ring-4 focus:ring-blue-200 text-black"
                    />
                </div>
                <div class="flex flex-col space-y-1">
                    <div class="flex items-center justify-between">
                        <label for="password" class="text-sm font-semibold text-gray-400">Password</label>
                        <a href="#" class="text-sm text-blue-600 hover:underline focus:text-blue-800" tabindex="-1">Forgot Password?</a>
                    </div>
                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="A very secure password"
                            class="px-4 py-2 transition duration-300 border border-gray-300 rounded focus:border-transparent focus:outline-none focus:ring-4 focus:ring-blue-200 text-black"
                    />
                </div>
                <div>
                    <button
                            type="submit"
                            class="w-full px-4 py-2 text-lg font-semibold text-white transition-colors duration-300 bg-blue-500 rounded-md shadow hover:bg-blue-600 focus:outline-none focus:ring-blue-200 focus:ring-4"
                    >
                        Log in
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
