<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <link rel="icon" th:href="@{/img/favicon.ico}">
    <title>Licensing Panel Login</title>
    <!-- Bootstrap core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <!-- Font Awesome CSS -->
    <script src="https://kit.fontawesome.com/f243dd965e.js" crossorigin="anonymous"></script>
    <!-- Custom styles for this template -->
    <link th:href="@{/css/loginstyle.css}" rel="stylesheet">
    <link th:href="@{/css/index.css}" rel="stylesheet">
    <!-- Tailwind CSS
    <script src="https://cdn.tailwindcss.com"></script>
    -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.1/dist/js.cookie.min.js"></script>

    <!-- React start -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin th:if="${isDevMode}"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin th:if="${isDevMode}"></script>

    <script src="https://unpkg.com/react@18/umd/react.production.js" crossorigin th:if="!${isDevMode}"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.js" crossorigin th:if="!${isDevMode}"></script>
    <!-- React end -->
</head>

<body class="bg-dark">
<div class="card bg-gray center-align login-card position-absolute top-50 start-50 translate-middle" style="width:350px;">
    <div class="card-body" layout:fragment="content">
        <div class="card login-form">
            <div class="card-body">
                <h3 class="card-title text-center">Log in</h3>
                <div class="card-text">
                    <div th:if="${#strings.equals(loginError, 'true')}" class="alert alert-danger alert-dismissible fade show" role="alert"><p th:text="${errorMessage}">Invalid credentials.</p></div>
                    <div th:if="${#strings.equals(logout, 'true')}" class="alert alert-success alert-dismissible fade show" role="alert"><p>Logged out.</p></div>
                    <form id="loginForm" th:action="@{/login}" method="post" th:object="${login}">
                        <!-- to error: add class "has-danger" -->
                        <div class="form-group" style="padding-top: 20px">
                            <label for="username">Username</label>
                            <input type="text" class="form-control form-control-sm" id="username" aria-describedby="usernameHelp" th:field="${login.username}">
                        </div>
                        <div class="form-group" style="padding-top: 20px">
                            <label for="password">Password</label>
                            <!--
                            <a href="#" style="float:right;font-size:12px;">Forgot password?</a>
                            -->
                            <input type="password" class="form-control form-control-sm" id="password" th:field="${login.password}">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        function login() {
            console.log("Logging in...");
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const data = {
                "username": username,
                "password": password
            };
            console.log({data});
            $.ajax(
                {
                    url: "/api/auth/login",
                    type: "POST",
                    data: JSON.stringify(data),
                    contentType: "application/json",
                    dataType: "json",
                    success: function (data) {
                        console.log(data);
                        if (data.success) {
                            const token = data.token;
                            // set this token as a cookie
                            document.cookie = "token=" + token;
                            Cookies.set('token', token);
                            debugger;
                            window.location.href = "/home";
                        } else {
                            window.location.href = "/login?error=true";
                        }
                    },
                    error: function (data) {
                        console.log(data);
                        window.location.href = "/login?error=true";
                    }
                }
            )
        }

        const form = document.getElementById('loginForm');
        //form.addEventListener('submit', login);
    </script>
</div>
<!-- Main ends -->
<!-- Bootstrap scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
</body>

</html>
