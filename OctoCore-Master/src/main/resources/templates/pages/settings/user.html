<!doctype html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}"
>
<head>
    <link href="https://unpkg.com/filepond/dist/filepond.css" rel="stylesheet">
    <link
            href="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.css"
            rel="stylesheet"
    />
</head>

<body>
<!-- Content starts -->
<div layout:fragment="content">
    <h1 class="center-text">User Settings</h1>
    <!-- We'll transform this input into a pond -->
    <input type="file"
           class="filepond"
           name="filepond"
           accept="image/png, image/jpeg, image/gif"
    />
    <div class="centered" style="padding-top: 10px">
        <button class="btn btn-primary" onclick="upload()">Upload</button>
        <p style="padding-left: 2px; padding-right: 2px;"></p>
        <button class="btn btn-secondary" onclick="clearPicture()">Clear Picture</button>
    </div>
    <!-- TODO Timezone picker -->
    <!-- Load FilePond library -->
    <script src="https://unpkg.com/filepond/dist/filepond.js"></script>
    <script src="https://unpkg.com/filepond-plugin-file-encode/dist/filepond-plugin-file-encode.js"></script>
    <script src="https://unpkg.com/filepond-plugin-file-validate-type/dist/filepond-plugin-file-validate-type.js"></script>
    <script src="https://unpkg.com/filepond-plugin-image-exif-orientation/dist/filepond-plugin-image-exif-orientation.js"></script>
    <script src="https://unpkg.com/filepond-plugin-image-preview/dist/filepond-plugin-image-preview.js"></script>
    <script src="https://unpkg.com/filepond-plugin-image-crop/dist/filepond-plugin-image-crop.js"></script>
    <script src="https://unpkg.com/filepond-plugin-image-resize/dist/filepond-plugin-image-resize.js"></script>
    <script src="https://unpkg.com/filepond-plugin-image-transform/dist/filepond-plugin-image-transform.js"></script>
    <script th:src="@{/js/pages/settings/user.js}"></script>
    <style>
        .filepond--drop-label {
            color: #4c4e53;
        }

        .filepond--label-action {
            text-decoration-color: #4d4d4d;
        }

        .filepond--panel-root {
            background-color: #edf0f4;
        }

        .filepond--root {
            width:170px;
            margin: 0 auto;
        }
    </style>
</div>
<!-- Content ends -->
</body>

</html>
