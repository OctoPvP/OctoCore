<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
  layout:decorate="~{loginlayout}"
>

<body>
    <!-- Content starts -->
    <div class="card-body" layout:fragment="content">
      <h4 class="card-title">Select your Identity Provider:</h4>
      <small>If you don't know, ask your staff manager.</small>
      <br/>
      <form th:action="${idpDiscoReturnURL}" method="get">
        <div class="card">
          <div class="card-body bg-dark">
            <fieldset class="form-group">
              <div class="form-check" th:each="idp : ${idps}">
                <label class="form-check-label">
                  <input type="radio" class="form-check-input" th:name="${idpDiscoReturnParam}" th:id="'idp_' + ${idp}" th:value="${idp}" />
                  <span class="badge badge-dark" th:text="${idp}">null</span>
                </label>
              </div>
            </fieldset>
          </div>
        </div>
        <br/>
        <button type="submit" class="btn btn-primary btn-sm">
          <i class="fas fa-key"></i> Login
        </button>
      </form>
    </div>
    <!-- Content ends -->
</body>

</html>
