#The master server on the network (can only be 1)
master: false
database:
  sql:
    username: octocore
    password: octocore
    db: octocore
    url: localhost
    port: 3306
  redis:
    #enables redis caching (experimental)
    enabled: false
    host: localhost
    port: 6379
    auth:
      enabled: false
      username: default
      password: default
  mongo:
    host: localhost
    port: 27017
    auth:
      enabled: false
      username: default
      password: default
      db: default
tab:
  header: '&a&lPlaying on the OctoPvP Network&r'
  footer: '&e&lplay.octopvp.net'
update-tab-interval: 45
update-pdata-interval: 100
default-tab: true
settings:
  auto-respawn: true
  world-name: world
  spawn:
    x: 0
    y: 100
    z: 0